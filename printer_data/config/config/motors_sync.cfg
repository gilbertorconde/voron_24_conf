###########################################################################################
######################## AWD belt motor synchronization (motors-sync) #####################
###########################################################################################
# https://github.com/MRX8024/motors-sync  (module lives in ~/motors-sync, linked into klipper)
#
# Why: on AWD CoreXY each belt is split into two loops by the two motor pulleys. When the TMC
# drivers power on, each rotor snaps to the nearest 4-full-step window independently, so the
# two motors on one belt can disagree by up to 0.8 mm (GT2 20T). SYNC_MOTORS measures the
# impulse from re-enabling one motor with the toolhead ADXL345 and steps it until the belt
# loops are evenly tensioned. The result is lost whenever the steppers are disabled.
#
# Commands:
#   SYNC_MOTORS                      full sync (run with cold hotend, fans off)
#   SYNC_MOTORS RESTORE_SYNC=1       re-apply last known good correction, no measurement
#   SYNC_MOTORS_STATS [CLEAR=1]      show / clear history
#   SYNC_MOTORS_CALIBRATE AXIS=x     calibrate steps_model for this printer (one-time, optional)

[motors_sync]
axes: x,y
accel_chip: adxl345
#   Orbiter O2S onboard ADXL345 (config/toolhead-orbiter-o2s/accelerometer.cfg)
microsteps: 16
#   Resolution used while nudging the motors. Steppers run at 64, but the wiki recommends
#   not going above 16 with a GT2 20T pulley: finer steps give impulse differences too
#   small for the accelerometer to resolve and the sync may stop early.
#steps_model: linear, 10000, 0
#   Default safe model. Run SYNC_MOTORS_CALIBRATE AXIS=x once to fit a model for this
#   machine; it will offer to SAVE_CONFIG the result.
max_step_size: 3
retry_tolerance: 1000
#   Impulse magnitude the result must fall below to count as synced (accel: 200..2000).
#   Start loose; lower it once SYNC_MOTORS_STATS shows what a good sync looks like here.
retries: 3
head_fan: fan, temperature_fan toolboard
#   Fans switched off during measurement so their vibration does not pollute the impulse.
#   hotend_fan is deliberately NOT listed so a manual SYNC_MOTORS with a hot nozzle can
#   never starve the heatbreak; the START_PRINT hook runs before the hotend heats anyway.
axis_prefix_x: X
axis_prefix_y: Y


# Re-apply the last good correction as soon as Klipper starts, before anything moves the
# gantry. This does not measure anything; it just puts the motors close to the sync point
# so the first full SYNC_MOTORS needs fewer iterations (and the belts are not fighting
# during homing).
[delayed_gcode restore_motors_sync]
initial_duration: 2.0
gcode:
    SYNC_MOTORS RESTORE_SYNC=1


# START_PRINT hook. Runs right after homing, before any heater/fan action. Skips the sync
# if it was already done in this power-on session (steppers never disabled since).
[gcode_macro _MODULE_MOTORS_SYNC]
description: Synchronize AWD belt motors if not already synced since the steppers were last enabled
gcode:
    {% set verbose = printer["gcode_macro _USER_VARIABLES"].verbose %}
    {% if printer.motors_sync.applied %}
        {% if verbose %}
            RESPOND MSG="Motors already synced this session, skipping"
        {% endif %}
    {% else %}
        {% if verbose %}
            RESPOND MSG="Synchronizing AWD belt motors..."
        {% endif %}
        SYNC_MOTORS
    {% endif %}
