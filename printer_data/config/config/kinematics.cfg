[printer]
kinematics: corexy
#max_z_velocity: 20
#max_z_accel: 300

#square_corner_velocity: 9.0

## INITIAL VALUES FROM https://github.com/VoronDesign/Voron-2/blob/Voron2.4/firmware/klipper_configurations/M8P/Voron2_M8P-v2.0_config.cfg
#max_velocity: 300  
#max_accel: 4000
max_z_velocity: 20 			#Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
max_accel: 8700 # BETTER_AUTO_SPEED 2026-11-04: 10918 passed at v1687 (diag), derated; Ellis pattern 50x valid at SCV 5 (X9.0 Y2.3) and SCV 9 (X8.0 Y3.3)
max_velocity: 500

square_corner_velocity: 9.0


[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode:
    {% if printer["gcode_macro _USER_VARIABLES"].status_leds_enabled %}
        STATUS_LEDS COLOR="ERROR"
    {% endif %}
    {% if printer["gcode_macro _USER_VARIABLES"].probe_type_enabled == "dockable" or printer["gcode_macro _USER_VARIABLES"].probe_type_enabled == "dockable_virtual" %}
        _PROBE_ON_ERROR_ACTION
    {% endif %}

    # Clear per-print state, park (only if homed) and shut the heaters off. This used to only
    # park, leaving bed/hotend/chamber hot until the 30 min idle timeout. Skew is cleared first
    # because with it active the park move can exceed position_max (see END_PRINT).
    SET_SKEW CLEAR=1
    _CLEAR_LAYER_ACTIONS
    {% if "xyz" in printer.toolhead.homed_axes %}
        PARK
    {% endif %}
    TURN_OFF_HEATERS
    M107
    _MODULE_RESET_LIMITS
   

[idle_timeout]
timeout: 1800
gcode:
    {% if printer.pause_resume.is_paused %}
        # Paused print (filament change, runout...): only cool the nozzle to stop oozing/heat
        # creep. Bed, chamber and motors stay on so the print can still be resumed; RESUME
        # reheats the nozzle to the temperature saved at PAUSE.
        RESPOND MSG="Idle timeout while paused: nozzle off, bed/motors kept on. RESUME will reheat."
        M104 S0
    {% else %}
    RESPOND MSG="Idle timeout reached"
    TURN_OFF_HEATERS
    M84
    {% if printer["gcode_macro _USER_VARIABLES"].light_enabled %}
        LIGHT_OFF
    {% endif %}
    {% if printer["gcode_macro _USER_VARIABLES"].status_leds_enabled %}
        STATUS_LEDS COLOR="OFF"
    {% endif %}
    {% endif %}

[pause_resume]
[display_status]
[exclude_object]
[respond]

[force_move]
enable_force_move: True

[gcode_arcs]
resolution: 0.1

[include scripts/*.cfg]
[include ../macros/base/*.cfg]
[include ../macros/base/homing/homing_*.cfg]
# NOTE: the leading underscore means this file is NOT matched by the glob above,
# so it must be included explicitly. Without it there is no [homing_override] and
# G28 falls back to stock Klipper order (X, Y, Z), ignoring every homing_* variable.
[include ../macros/base/homing/_homing_override.cfg]

[include ../macros/calibration/calib*.cfg]

[include ../macros/helpers/filament_swap.cfg]
[include ../macros/helpers/heatsoak.cfg]
[include ../macros/helpers/prime_line.cfg]
[include ../macros/helpers/nozzle_cleaning.cfg]
[include ../macros/helpers/temp_check.cfg]
# Provides _PART_FAN_CHECK and _BACKGROUND_HOTEND_TACHO_CHECK, gated by
# part_fan_tach_enabled / hotend_fan_tach_enabled (set in the toolhead thermals.cfg).
[include ../macros/helpers/tachometer_check.cfg]

[include ../macros/miscs/compatibility.cfg]
[include ../macros/miscs/debugging.cfg]
[include ../macros/miscs/startup.cfg]
