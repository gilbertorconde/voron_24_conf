[controller_fan drivers_fan]
pin: DRIVERS_FAN
max_power: 1.0
shutdown_speed: 0.0
fan_speed: 0.4
idle_speed: 0.0
# Previously only watched stepper_x, so the driver fan never ran for heater load alone.
# List every driver on this board plus the heaters they sit next to.
stepper:
    stepper_x, stepper_x1, stepper_y, stepper_y1,
    stepper_z, stepper_z1, stepper_z2, stepper_z3
heater: heater_bed, heater_chamber
