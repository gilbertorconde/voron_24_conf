[controller_fan drivers_fan]
pin: DRIVERS_FAN
max_power: 1.0
shutdown_speed: 0.0
fan_speed: 0.4
idle_speed: 0.0
# This fan sits directly over the stepper drivers, so it is tied to the drivers only -
# deliberately no "heater:" here, otherwise it would spin for the whole of a heatsoak or an
# ABS print with no driver load to justify it.
# Listing all eight (it previously named only stepper_x) so the fan still runs if the
# enable lines are ever split up; today they all enable together anyway.
stepper:
    stepper_x, stepper_x1, stepper_y, stepper_y1,
    stepper_z, stepper_z1, stepper_z2, stepper_z3
