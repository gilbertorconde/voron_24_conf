[gcode_macro _USER_VARIABLES]
# We can declare an "inductive_virtual" probe type as it's pretty close to the Beacon way of working and should just work!
variable_probe_type_enabled: "inductive_virtual"
# variable_startprint_actions: "bed_soak", "extruder_preheating", "chamber_soak", "clean", "tilt_calib", "cartographer_touch", "extruder_heating", "purge", "clean", "bedmesh", "primeline"
variable_startprint_actions: "set_heat_chamber", "set_heat_bed", "cartographer_model", "bed_soak", "extruder_preheating", "chamber_soak", "tilt_calib", "clean", "cartographer_touch", "extruder_heating", "purge", "clean", "bedmesh", "primeline"
gcode:

[include ../../macros/base/probing/generic_probe.cfg]

[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_4A0017000850525537333120-if00
restart_method: command

[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 40 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: no # For extra output

# Cartographer touch homing enforces its own nozzle temp cap (default 150°C in the plugin).
# This must be >= variable_tap_max_probing_temp in variables.cfg if you probe hot.
# Raising it can damage some build surfaces — use at your own risk (see Cartographer docs).
[cartographer touch]
UNSAFE_max_touch_temperature: 175

# Scan mesh settings (these, not [bed_mesh] horizontal_move_z, control scan meshes).
[cartographer scan]
mesh_height: 3                # coil height during scan mesh (plugin default 3, min 1)
mesh_runs: 2                  # second pass traces back over the bed and averages; better mesh, ~2x scan time
#mesh_direction: x            # axis with the most moves (x | y)
#mesh_path: snake             # snake | alternating_snake | spiral | random | hilbert
#mesh_max_corner_radius: auto

[temperature_sensor Cartographer_MCU]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
max_temp: 105

# [safe_z_home] is intentionally disabled: it and [homing_override] both hook G28,
# and Klippain's homing override (macros/base/homing/_homing_override.cfg) is the one
# that honours variable_homing_first / homing_zhop / homing_backoff_distance_xy.
# The override does its own pre-homing Z hop (variable_homing_zhop) and moves to the
# bed_mesh zero_reference_position before homing Z.
# [safe_z_home]
# home_xy_position: 175, 175
# z_hop: 10


