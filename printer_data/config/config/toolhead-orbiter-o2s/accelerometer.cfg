###########################################################################################
###################### Onboard accelerometer and resonance tester config ##################
###########################################################################################

# FROM TOOLHEAD:
[adxl345]
cs_pin = toolhead:PA4
spi_bus = spi1
axes_map = y, z, x # Shake&Tune v6 AXES_MAP_CALIBRATION 2026-11-04 (2 runs agree; old -x came from a v5 run with 41° Z error)
spi_speed = 5000000

[include ../../macros/helpers/resonance_override.cfg]

[resonance_tester]
accel_chip = adxl345
probe_points = 175,175,30  # XYZ head position for testing
min_freq = 20
max_freq = 200  # X axis resonates up to ~160 Hz with small peaks at 183/195 Hz