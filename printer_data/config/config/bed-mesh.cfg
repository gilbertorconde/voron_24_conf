# If this files is included, then it also activate the bed_mesh
# automatically in the START_PRINT macro
[gcode_macro _USER_VARIABLES]
variable_bed_mesh_enabled: True
gcode:

# Single definition of BED_MESH_CALIBRATE. It merges what used to be two competing
# definitions: this file's "drop the bed heater while scanning" wrapper, and the probing
# override (_CG28 + ACTIVATE_PROBE/DEACTIVATE_PROBE). Previously both declared
# [gcode_macro BED_MESH_CALIBRATE]; Klipper merges duplicate sections last-wins, so the
# include below silently replaced this one and the heater wrapper never ran.
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BASE_BED_MESH_CALIBRATE
description: Perform Mesh Bed Leveling with the bed heater off during the scan
gcode:
    {% set verbose = printer["gcode_macro _USER_VARIABLES"].verbose %}
    {% set probe_type_enabled = printer["gcode_macro _USER_VARIABLES"].probe_type_enabled %}
    {% set eddy_ng_enabled = printer["gcode_macro _USER_VARIABLES"].eddy_ng_enabled|default(False) %}
    {% set TARGET_TEMP = printer.heater_bed.target %}

    {% if verbose %}
        { action_respond_info("Bed Mesh Calibrate") }
    {% endif %}
    _CG28

    ACTIVATE_PROBE

    {% if probe_type_enabled == "dockable" %}
        SET_GCODE_VARIABLE MACRO=_PROBE_ON_ERROR_ACTION VARIABLE=probing VALUE=True
    {% endif %}

    # Bed heater off for the duration of the scan (mains noise / thermal drift on the coil),
    # then restored to whatever it was set to.
    M140 S0
    {% if eddy_ng_enabled %}
        _BASE_BED_MESH_CALIBRATE METHOD=rapid_scan {rawparams}
    {% else %}
        _BASE_BED_MESH_CALIBRATE {rawparams}
    {% endif %}
    M140 S{TARGET_TEMP}

    {% if probe_type_enabled == "dockable" %}
        SET_GCODE_VARIABLE MACRO=_PROBE_ON_ERROR_ACTION VARIABLE=probing VALUE=False
    {% endif %}

    DEACTIVATE_PROBE

# NOTE: ../macros/base/probing/overrides/bed_mesh_calibrate.cfg is deliberately NOT included
# any more - its contents are folded into the macro above. Re-including it would shadow this one.
# And also include the adaptive mesh macro at the same time
[include ../macros/calibration/adaptive_bed_mesh.cfg]


[bed_mesh]
speed: 300
# horizontal_move_z: 10
# horizontal_move_z: 0.7 # 0.7~1.0mm is recommended
horizontal_move_z: 3 # 2mm for eddy coil
# mesh_min: 35, 35
mesh_min: 32, 32
mesh_max: 325, 325
probe_count: 30, 30
adaptive_margin: 10
algorithm: bicubic
zero_reference_position: 175, 175
