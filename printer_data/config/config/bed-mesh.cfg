# If this files is included, then it also activate the bed_mesh
# automatically in the START_PRINT macro
[gcode_macro _USER_VARIABLES]
variable_bed_mesh_enabled: True
gcode:

# Single definition of BED_MESH_CALIBRATE (the probing override file
# ../macros/base/probing/overrides/bed_mesh_calibrate.cfg is folded in here, see note below).
# rename_existing wraps the Cartographer plugin's BED_MESH_CALIBRATE, which does the scan mesh
# itself and accepts MESH_MIN / MESH_MAX / PROBE_COUNT / ADAPTIVE / RUNS / HEIGHT / SPEED etc.
# Scan height/runs/path come from [cartographer scan] in probe-cartographer-3d/probe.cfg.
#
# 2026-11-04: removed the "bed heater off during the scan" wrapper. Cartographer docs give no
# basis for it, and it made the mesh get captured on a bed that was cooling (and changing
# shape) mid-scan, then reheated after without waiting - so the mesh didn't match the bed
# you then print on. Also removed the eddy-ng METHOD=rapid_scan branch: on Cartographer any
# METHOD other than scan silently falls back to slow point-by-point probing.
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BASE_BED_MESH_CALIBRATE
description: Perform a Cartographer scan bed mesh
gcode:
    {% set verbose = printer["gcode_macro _USER_VARIABLES"].verbose %}
    {% set probe_type_enabled = printer["gcode_macro _USER_VARIABLES"].probe_type_enabled %}

    {% if verbose %}
        { action_respond_info("Bed Mesh Calibrate") }
    {% endif %}

    _CG28
    ACTIVATE_PROBE
    {% if probe_type_enabled == "dockable" %}
        SET_GCODE_VARIABLE MACRO=_PROBE_ON_ERROR_ACTION VARIABLE=probing VALUE=True
    {% endif %}

    _BASE_BED_MESH_CALIBRATE {rawparams}

    {% if probe_type_enabled == "dockable" %}
        SET_GCODE_VARIABLE MACRO=_PROBE_ON_ERROR_ACTION VARIABLE=probing VALUE=False
    {% endif %}
    DEACTIVATE_PROBE

# NOTE: ../macros/base/probing/overrides/bed_mesh_calibrate.cfg is deliberately NOT included
# any more - its contents are folded into the macro above. Re-including it would shadow this one.
# And also include the adaptive mesh macro at the same time
[include ../macros/calibration/adaptive_bed_mesh.cfg]


[bed_mesh]
speed: 300                    # Cartographer docs: scan at >= 300 mm/s
horizontal_move_z: 3          # not used by scan meshes (see [cartographer scan] mesh_height); kept for non-scan methods
mesh_min: 32, 40 # Y >= y_offset (40) so the nozzle stays >= Y0
mesh_max: 325, 325
probe_count: 30, 30
mesh_pps: 0, 0                # Cartographer docs: dense scan mesh, no extra interpolation needed
algorithm: bicubic            # no effect while mesh_pps is 0; kept for the adaptive macro
adaptive_margin: 10
zero_reference_position: 175, 175
