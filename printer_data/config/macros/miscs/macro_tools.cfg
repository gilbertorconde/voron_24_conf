#########################################################################################
# Macro introspection helpers (idea from jschuh/klipper-macros globals.cfg LIST_MACROS).
# Useful because mainsail.cfg and Klippain both define PAUSE/RESUME/CANCEL_PRINT etc.,
# so it is not obvious which definition and rename chain is active.
#   LIST_MACROS [FILTER=<text>]   list macros (name, rename_existing, description)
#   SHOW_MACRO MACRO=<name>        show one macro's rename chain and description
#########################################################################################

[gcode_macro LIST_MACROS]
description: List gcode macros with their rename_existing and description (FILTER=text optional)
gcode:
    {% set filt = params.FILTER|default("")|lower %}
    {% set cfg = printer.configfile.settings %}
    {% set out = [] %}
    {% for section in cfg|sort %}
        {% if section.startswith("gcode_macro ") %}
            {% set name = section[12:] %}
            {% if not filt or filt in name|lower %}
                {% set s = cfg[section] %}
                {% set line = name|upper %}
                {% if s.rename_existing is defined and s.rename_existing %}
                    {% set line = line ~ " (wraps -> " ~ s.rename_existing ~ ")" %}
                {% endif %}
                {% if s.description is defined and s.description and s.description != "G-Code macro" %}
                    {% set line = line ~ ": " ~ s.description %}
                {% endif %}
                {% set _ = out.append(line) %}
            {% endif %}
        {% endif %}
    {% endfor %}
    RESPOND MSG="{out|length} macros{' matching ' ~ filt if filt else ''}:"
    {% for l in out %}
        RESPOND MSG="{l}"
    {% endfor %}

[gcode_macro SHOW_MACRO]
description: Show a macro's rename chain and description (MACRO=name)
gcode:
    {% set name = params.MACRO|default("")|lower %}
    {% set cfg = printer.configfile.settings %}
    {% if ("gcode_macro " ~ name) not in cfg %}
        RESPOND TYPE=error MSG="No gcode_macro named {name|upper}"
    {% else %}
        {% set s = cfg["gcode_macro " ~ name] %}
        RESPOND MSG="{name|upper}: {s.description|default('')}"
        {% if s.rename_existing is defined and s.rename_existing %}
            RESPOND MSG="  wraps the previous {name|upper}, now callable as {s.rename_existing}"
        {% endif %}
    {% endif %}
