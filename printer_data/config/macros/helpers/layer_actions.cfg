#########################################################################################
# Layer actions: run any G-code at a given layer or height during a print.
# Inspired by jschuh/klipper-macros layers.cfg (GCODE_AT_LAYER), rewritten standalone so it
# coexists with mainsail.cfg's SET_PRINT_STATS_INFO / SET_PAUSE_AT_LAYER / SET_PAUSE_NEXT_LAYER.
#
# SLICER SETUP (OrcaSlicer > Printer settings > Machine G-code > "Layer change G-code"):
#     _LAYER_CHANGE LAYER={layer_num + 1} HEIGHT={layer_z}
# (replace any existing SET_PRINT_STATS_INFO CURRENT_LAYER=... line there; _LAYER_CHANGE calls it)
#
# Commands:
#   GCODE_AT_LAYER LAYER=<n> COMMAND="<gcode>"     run at the start of layer n (1-based)
#   GCODE_AT_LAYER HEIGHT=<z> COMMAND="<gcode>"    run at the first layer with Z >= z
#   SPEED_AT_LAYER LAYER=<n>|HEIGHT=<z> SPEED=<%>  speed factor (M220)
#   FLOW_AT_LAYER  LAYER=<n>|HEIGHT=<z> FLOW=<%>   flow factor (M221)
#   TEMP_AT_LAYER  LAYER=<n>|HEIGHT=<z> TEMP=<C>   nozzle temperature (M104)
#   FAN_AT_LAYER   LAYER=<n>|HEIGHT=<z> SPEED=<%>  part fan (M106)
#   LIST_LAYER_ACTIONS                             show what is queued
#   CANCEL_LAYER_ACTIONS                           clear the queue (pause-at-layer too)
#   Pausing: use Mainsail's SET_PAUSE_AT_LAYER / SET_PAUSE_NEXT_LAYER (or COMMAND=PAUSE).
# Actions are one-shot and are cleared by END_PRINT, CANCEL_PRINT and on_error_gcode.
# Limitation: COMMAND may not contain quotes, "#" or ";" (Klipper parses those as comments).
#########################################################################################

[gcode_macro _LAYER_ACTIONS]
description: Internal storage for scheduled layer actions
variable_queue: []
gcode:

[gcode_macro GCODE_AT_LAYER]
description: Schedule G-code at a layer (LAYER=n) or height (HEIGHT=z) of the current/next print
gcode:
    {% set cmd = params.COMMAND|default("")|string %}
    {% if not cmd %}
        { action_raise_error("GCODE_AT_LAYER: COMMAND=\"<gcode>\" is required") }
    {% endif %}
    {% if "'" in cmd %}
        { action_raise_error("GCODE_AT_LAYER: COMMAND may not contain single quotes") }
    {% endif %}
    {% if params.LAYER is defined %}
        {% set entry = {'layer': params.LAYER|int, 'height': -1.0, 'cmd': cmd} %}
        {% set when = "layer " ~ (params.LAYER|int) %}
    {% elif params.HEIGHT is defined %}
        {% set entry = {'layer': -1, 'height': params.HEIGHT|float, 'cmd': cmd} %}
        {% set when = "Z >= " ~ (params.HEIGHT|float) ~ " mm" %}
    {% else %}
        { action_raise_error("GCODE_AT_LAYER: LAYER=<n> or HEIGHT=<z> is required") }
    {% endif %}
    {% set queue = printer["gcode_macro _LAYER_ACTIONS"].queue + [entry] %}
    SET_GCODE_VARIABLE MACRO=_LAYER_ACTIONS VARIABLE=queue VALUE='{queue|tojson}'
    RESPOND MSG="Scheduled at {when}: {cmd}"

[gcode_macro SPEED_AT_LAYER]
description: Set speed factor (%) at a layer or height
gcode:
    {% set where = ("LAYER=" ~ params.LAYER) if params.LAYER is defined else ("HEIGHT=" ~ params.HEIGHT|default(0)) %}
    GCODE_AT_LAYER {where} COMMAND="M220 S{params.SPEED|default(100)|int}"

[gcode_macro FLOW_AT_LAYER]
description: Set flow factor (%) at a layer or height
gcode:
    {% set where = ("LAYER=" ~ params.LAYER) if params.LAYER is defined else ("HEIGHT=" ~ params.HEIGHT|default(0)) %}
    GCODE_AT_LAYER {where} COMMAND="M221 S{params.FLOW|default(100)|int}"

[gcode_macro TEMP_AT_LAYER]
description: Set nozzle temperature at a layer or height
gcode:
    {% if params.TEMP is not defined %}
        { action_raise_error("TEMP_AT_LAYER: TEMP=<C> is required") }
    {% endif %}
    {% set where = ("LAYER=" ~ params.LAYER) if params.LAYER is defined else ("HEIGHT=" ~ params.HEIGHT|default(0)) %}
    GCODE_AT_LAYER {where} COMMAND="M104 S{params.TEMP|int}"

[gcode_macro FAN_AT_LAYER]
description: Set part fan speed (%) at a layer or height
gcode:
    {% set where = ("LAYER=" ~ params.LAYER) if params.LAYER is defined else ("HEIGHT=" ~ params.HEIGHT|default(0)) %}
    GCODE_AT_LAYER {where} COMMAND="M106 S{(params.SPEED|default(100)|float * 2.55)|round|int}"

[gcode_macro LIST_LAYER_ACTIONS]
description: Show scheduled layer actions
gcode:
    {% set queue = printer["gcode_macro _LAYER_ACTIONS"].queue %}
    {% if not queue %}
        RESPOND MSG="No layer actions scheduled"
    {% else %}
        {% set lines = [] %}
        {% for e in queue %}
            {% set _ = lines.append(("layer " ~ e.layer) if e.layer >= 0 else ("Z >= " ~ e.height)) %}
            {% set _ = lines.append("  -> " ~ e.cmd) %}
        {% endfor %}
        RESPOND MSG="Layer actions: {lines|join(' | ')}"
    {% endif %}

[gcode_macro CANCEL_LAYER_ACTIONS]
description: Clear all scheduled layer actions and Mainsail pause-at-layer
gcode:
    _CLEAR_LAYER_ACTIONS
    RESPOND MSG="Layer actions cleared"

[gcode_macro _CLEAR_LAYER_ACTIONS]
description: Internal - clear layer actions and Mainsail pause-at-layer state
gcode:
    SET_GCODE_VARIABLE MACRO=_LAYER_ACTIONS VARIABLE=queue VALUE='[]'
    {% if printer["gcode_macro SET_PAUSE_NEXT_LAYER"] is defined %}
        SET_PAUSE_NEXT_LAYER ENABLE=0
    {% endif %}
    {% if printer["gcode_macro SET_PAUSE_AT_LAYER"] is defined %}
        SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    {% endif %}

[gcode_macro _LAYER_CHANGE]
description: Call from the slicer's layer-change G-code: _LAYER_CHANGE LAYER={layer_num + 1} HEIGHT={layer_z}
gcode:
    {% set layer = params.LAYER|default(0)|int %}
    {% set height = params.HEIGHT|default(printer.gcode_move.gcode_position.z)|float %}
    # Mainsail's override handles pause-at-layer / pause-next-layer and the layer counter
    SET_PRINT_STATS_INFO CURRENT_LAYER={layer}
    _LAYER_ACTIONS_RUN LAYER={layer} HEIGHT={height}

[gcode_macro _LAYER_ACTIONS_RUN]
description: Internal - run the layer actions that are due
gcode:
    {% set layer = params.LAYER|int %}
    {% set height = params.HEIGHT|float %}
    {% set due = [] %}
    {% set keep = [] %}
    {% for e in printer["gcode_macro _LAYER_ACTIONS"].queue %}
        {% if (e.layer >= 0 and layer >= e.layer) or (e.height >= 0 and height >= e.height - 0.0001) %}
            {% set _ = due.append(e) %}
        {% else %}
            {% set _ = keep.append(e) %}
        {% endif %}
    {% endfor %}
    {% if due %}
        # Dequeue first, so an action that errors is not re-run on every following layer
        SET_GCODE_VARIABLE MACRO=_LAYER_ACTIONS VARIABLE=queue VALUE='{keep|tojson}'
        {% for e in due %}
            RESPOND MSG="Layer {layer} (Z={height|round(2)}): {e.cmd}"
            {e.cmd}
        {% endfor %}
    {% endif %}
