[gcode_macro _LOW_TEMP_CHECK]
description: Check the nozzle is at temperature and heat it if needed
gcode: 
    {% set T = params.T|default(printer["gcode_macro _USER_VARIABLES"].print_default_extruder_temp)|float %}

    # A target below min_extrude_temp (e.g. safe_extruder_temp 170 < min_extrude_temp 180) is
    # treated like "no target": heat to T instead (upstream Klippain 29a6610).
    {% set MIN_EXTRUDE_TEMP = printer.configfile.settings.extruder.min_extrude_temp|float %}
    {% if printer.extruder.target != 0 and printer.extruder.target >= MIN_EXTRUDE_TEMP %}
        {% if printer.extruder.temperature < printer.extruder.target %}
            M109 S{printer.extruder.target|float} 
        {% endif %}
    {% else %}
        {% if printer.extruder.target < T %}
            M109 S{T}
        {% endif %}
    {% endif %}
