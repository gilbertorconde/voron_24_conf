[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
description: Pause the print and park
gcode:
    {% set light_enabled = printer["gcode_macro _USER_VARIABLES"].light_enabled %}
    {% set light_intensity_start_print = printer["gcode_macro _USER_VARIABLES"].light_intensity_start_print %}
    {% set idle_timeout_on_pause = printer["gcode_macro _USER_VARIABLES"].idle_timeout_on_pause|default(0)|int %}

    {% if printer.pause_resume.is_paused %}
        RESPOND MSG="Print is already paused"
    {% else %}
        SAVE_GCODE_STATE NAME=PAUSE_state
        # Remember where we were and how hot the nozzle was, so RESUME can return XY-then-Z,
        # undo PARK's retract and reheat if the idle timeout cooled the nozzle meanwhile.
        {% set pos = printer.gcode_move.gcode_position %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_x VALUE={pos.x}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_y VALUE={pos.y}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_z VALUE={pos.z}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_extruder_temp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted VALUE={1 if printer.extruder.can_extrude else 0}
        {% if light_enabled %}
            LIGHT_ON S={light_intensity_start_print}
        {% endif %}

        BASE_PAUSE
        PARK_PAUSE

        {% if idle_timeout_on_pause > 0 %}
            SET_IDLE_TIMEOUT TIMEOUT={idle_timeout_on_pause}
        {% endif %}
    {% endif %}


[gcode_macro RESUME]
rename_existing: BASE_RESUME
description: Resume the print: reheat if needed, return XY then Z, undo the park retract
variable_saved_x: 0.0
variable_saved_y: 0.0
variable_saved_z: 0.0
variable_saved_extruder_temp: 0.0
variable_retracted: 0
gcode:
    {% set St = printer["gcode_macro _USER_VARIABLES"].travel_speed %}
    {% set light_enabled = printer["gcode_macro _USER_VARIABLES"].light_enabled %}
    {% set light_intensity_printing = printer["gcode_macro _USER_VARIABLES"].light_intensity_printing %}
    {% set klippain_mmu_enabled = printer["gcode_macro _USER_VARIABLES"].klippain_mmu_enabled %}
    {% set idle_timeout_on_pause = printer["gcode_macro _USER_VARIABLES"].idle_timeout_on_pause|default(0)|int %}

    {% if not printer.pause_resume.is_paused %}
        RESPOND MSG="Print is not paused. Resume ignored"
    {% else %}
        {% set Sz = printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60 %}
        {% set fw_retract = printer["gcode_macro _USER_VARIABLES"].firmware_retraction_enabled|default(False) %}
        {% set material = printer["gcode_macro START_PRINT"].material %}
        {% set mparams = printer["gcode_macro _USER_VARIABLES"].material_parameters %}

        # The idle timeout turns the nozzle off during a long pause (see kinematics.cfg): reheat first.
        {% if saved_extruder_temp > 0 and printer.extruder.target < saved_extruder_temp %}
            RESPOND MSG="Reheating nozzle to {saved_extruder_temp}C before resuming..."
            M109 S{saved_extruder_temp}
        {% endif %}

        {% if klippain_mmu_enabled and printer.mmu.enabled and printer.mmu.is_locked %}
            RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=0
        {% else %}
            # Return XY at the park height first, then lower Z, instead of one diagonal move
            # that can drag the nozzle across the part.
            G90
            G1 X{saved_x} Y{saved_y} F{St * 60}
            G1 Z{saved_z} F{Sz}
            # Undo PARK's retract (it used G10, or G1 E- with the material/default length).
            {% if retracted and printer.extruder.can_extrude %}
                {% if fw_retract %}
                    G11
                {% else %}
                    {% set E = mparams[material].retract_length|default(1.7) if mparams[material] is defined else 1.7 %}
                    M83
                    G1 E{E} F2100
                {% endif %}
            {% endif %}
            RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted VALUE=0

        {% if light_enabled %}
            LIGHT_ON S={light_intensity_printing}
        {% endif %}

        {% if idle_timeout_on_pause > 0%}
            SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        {% endif %}

        BASE_RESUME
    {% endif %}
