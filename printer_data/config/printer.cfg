[input_shaper]
shaper_freq_x: 119.0 # 25770
shaper_type_x: ei
shaper_freq_y: 74.8 # 16410
shaper_type_y: mzv

[heater_bed]
control: pid
pid_kp: 61.907
pid_ki: 2.548
pid_kd: 376.085

[better_pid extruder continuous]
temps: 90, 150, 200, 250, 270
kps: 15.452, 20.550, 20.539, 25.134, 25.088
kis: 2.146, 5.269, 5.267, 6.445, 6.195
kds: 27.813, 20.036, 20.026, 24.505, 25.401

[extruder] # this will be ignored by the better_pid plugin
control: pid
pid_kp: 1
pid_ki: 1
pid_kd: 1

# [virtual_sdcard] is defined in config/kinematics.cfg with full on_error_gcode handling

[better_auto_speed]
results_dir: ~/printer_data/config/BetterAutoSpeed
max_missed: 6.0

